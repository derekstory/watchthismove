<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost ball — Watch This Move LLC</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<style>
  :root{--ink:#0A1A10; --cream:#F2EFE6; --cream-dim:rgba(242,239,230,.62);
    --green:#2D6E2D; --gold:#F5C518}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:
      radial-gradient(1100px 460px at 50% -140px, rgba(45,110,45,.32), transparent 70%),
      var(--ink);
    color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    text-align:center; line-height:1.6; padding:24px}
  .mark{font-family:'New York',ui-serif,Georgia,serif; font-size:13px; font-weight:600;
    letter-spacing:.34em; text-transform:uppercase; color:var(--gold); margin-bottom:16px}
  h1{font-family:'New York',ui-serif,Georgia,serif; font-size:clamp(30px,6vw,44px);
    font-weight:600; line-height:1.1}
  p{color:var(--cream-dim); margin-top:12px; font-size:17px}
  a{display:inline-block; margin-top:28px; background:var(--gold); color:#173118;
    font-weight:800; font-size:15px; padding:12px 28px; border-radius:100px;
    text-decoration:none}
  a:hover{filter:brightness(1.06)}
</style>
</head>
<body>
  <div>
    <p class="mark">Watch This Move</p>
    <h1>That one's in the rough.</h1>
    <p>The page you're looking for isn't here.</p>
    <a href="/">Back to the clubhouse</a>
  </div>
</body>
</html>
